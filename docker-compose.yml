# The whole RaceDay system with one command:
#
#   docker compose up --build
#
# then open http://localhost:8080 (website) and http://localhost:5272/swagger (API).
#
# Services:
#   web        - RaceDay.Mvc (Part 3). Talks only to the API.
#   api        - RaceDay.Api (Part 2). Owns the database and Azure Blob Storage.
#   sqlserver  - SQL Server 2022 for the API's data.
#   azurite    - Microsoft's Azure Blob Storage emulator. To use a real Azure Storage account
#                instead, set AZURE_STORAGE_CONNECTION_STRING before running compose.

services:
  web:
    build:
      context: ./src/RaceDay.Mvc
    container_name: raceday-web
    environment:
      RaceDayApi__BaseUrl: http://api:8080
    ports:
      - "8080:8080"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./src/RaceDay.Api
    container_name: raceday-api
    environment:
      ConnectionStrings__RaceDayDb: "Server=sqlserver,1433;Database=RaceDayDB;User Id=sa;Password=${SQL_SA_PASSWORD:-RaceDay!Passw0rd};TrustServerCertificate=True;MultipleActiveResultSets=true"
      # Falls back to the local Azurite emulator (its well-known public development key) when no Azure account is given.
      ConnectionStrings__AzureBlobStorage: "${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}"
    ports:
      - "5272:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_started
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: raceday-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:-RaceDay!Passw0rd}"
    ports:
      - "14333:1433"
    volumes:
      - raceday-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: raceday-azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - raceday-blob-data:/data

volumes:
  raceday-sql-data:
  raceday-blob-data:
