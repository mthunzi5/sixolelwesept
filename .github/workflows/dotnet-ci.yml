name: Build and test RaceDay

# Runs on every push to any branch (and on pull requests).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build API + MVC and run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore RaceDay.sln

      # The solution contains the API, the MVC web app and the tests.
      - name: Build solution (API, MVC, tests)
        run: dotnet build RaceDay.sln --configuration Release --no-restore

      - name: Publish MVC web app
        run: dotnet publish src/RaceDay.Mvc/RaceDay.Mvc.csproj --configuration Release --no-build --output publish/web

      # Tests use EF Core's in-memory provider, so no SQL Server is needed on the runner.
      - name: Run unit tests
        run: >
          dotnet test RaceDay.sln --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build MVC web app image
        run: docker build --tag raceday-web:ci src/RaceDay.Mvc

      - name: Build API image
        run: docker build --tag raceday-api:ci src/RaceDay.Api

      - name: Validate docker-compose file
        run: docker compose config --quiet
