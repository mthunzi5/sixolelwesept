name: Build and test API

# Runs on every push to any branch (and on pull requests), as required for Part 2.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore RaceDay.sln

      - name: Build
        run: dotnet build RaceDay.sln --configuration Release --no-restore

      # Tests use EF Core's in-memory provider, so no SQL Server is needed on the runner.
      - name: Run unit tests
        run: >
          dotnet test RaceDay.sln --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
